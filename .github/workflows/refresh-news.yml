name: Refresh news

on:
  schedule:
    # Every hour, on the hour (UTC). GitHub may delay scheduled runs 5-15 min under load.
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-news.yml"

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest headlines
        run: python scripts/fetch_news.py

      - name: Commit updated data.json
        run: |
          set -euo pipefail
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add site/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh news $(date -u +%FT%TZ)"
            git push
          fi

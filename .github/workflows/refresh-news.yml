name: Refresh news + deploy Pages

on:
  schedule:
    # Four attempts per hour at off-peak minutes (:07, :22, :37, :52). GitHub
    # actively de-prioritizes low-traffic public-repo cron jobs and only a
    # fraction of scheduled runs actually fire (~30% at any single slot). Four
    # evenly-spaced shots per hour lifts effective hit rate to ~80%+, keeping
    # the site no more than ~30 min stale in the common case.
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - ".github/workflows/refresh-news.yml"

# No 'contents: write' anymore: the workflow no longer commits data.json back
# to the repo. State (the previous data.json, used for 24h accumulation and
# scrape memoization) is preserved between runs via actions/cache instead.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Restore the previous run's data.json so the fetcher can carry forward
      # already-enriched items and avoid re-scraping the same articles every hour.
      # Cache keys are immutable, so we use a unique per-run key and rely on
      # restore-keys prefix matching to grab the newest existing entry.
      - name: Restore previous data.json from cache
        uses: actions/cache/restore@v4
        with:
          path: site/data.json
          key: daily-news-data-${{ github.run_id }}
          restore-keys: |
            daily-news-data-

      - name: Fetch latest headlines
        run: python scripts/fetch_news.py

      - name: Save updated data.json to cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: site/data.json
          key: daily-news-data-${{ github.run_id }}

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

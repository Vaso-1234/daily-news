name: Refresh news + deploy Pages

on:
  schedule:
    # Every hour, on the hour (UTC). GitHub may delay scheduled runs 5-15 min under load.
    - cron: "0 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - ".github/workflows/refresh-news.yml"

permissions:
  contents: write   # for the auto-commit of data.json
  pages: write      # for deploying to GitHub Pages
  id-token: write   # required by actions/deploy-pages for OIDC

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest headlines
        run: python scripts/fetch_news.py

      - name: Commit updated data.json
        run: |
          set -euo pipefail
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add site/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh news $(date -u +%FT%TZ)"
            git push
          fi

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
